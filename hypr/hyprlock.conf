label {
  monitor = DP-3
  text = cmd[update:1000] echo "$(date +"%A, %B %d")"
  color = rgba(242, 243, 244, 0.75)
  font_size = 20
  font_family = JetBrains Mono
  position = 0, 405
  halign = center
  valign = center
}

label {
  monitor = DP-3
  text = cmd[update:1000] echo "$(date +"%k:%M")"
  color = rgba(242, 243, 244, 0.75)
  font_size = 93
  font_family = JetBrains Mono Bold
  position = 0, 310
  halign = center
  valign = center
}


