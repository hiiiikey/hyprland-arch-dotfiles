general {
    lock_cmd = pidof hyprlock || hyprlock       # Avoid starting multiple hyprlock instances
    # before_sleep_cmd = loginctl lock-session    # Ensure the screen is locked before suspending
    after_sleep_cmd = hyprctl dispatch dpms on  # Wake screens up instantly on resume
}

# 1. Lock the screen after 5 minutes
listener {
    timeout = 300
    on-timeout = pidof hyprlock || hyprlock
}

# 2. Turn off the displays after 10 minutes
listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 3. Suspend the machine after 15 minutes
listener {
    timeout = 900
    on-timeout = systemctl suspend -i
}
